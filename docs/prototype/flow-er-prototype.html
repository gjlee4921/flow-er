<title>Wheelwright</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: an instrument workbench. A control bar on top, one working surface per tab, an inspector on the right. */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#EBEDF2; --plot:#FFFFFF;
  --ink:#131720; --ink-2:#414959; --muted:#677083; --line:#D8DCE4; --line-2:#BFC6D2;
  --accent:#4F3FD4; --accent-soft:#ECEAFD; --accent-ink:#FFFFFF;
  --ok:#1D7748; --ok-soft:#E1F1E8; --check:#955700; --check-soft:#FBEED7;
  --g0:#3567B0; --g1:#D9701A; --g2:#178F7C; --g3:#A8367A;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1015; --surface:#151920; --surface-2:#1C212A; --plot:#0A0C10;
    --ink:#E5E8EE; --ink-2:#B3BAC7; --muted:#8690A2; --line:#283039; --line-2:#3A4351;
    --accent:#9D92FF; --accent-soft:#231E4A; --accent-ink:#110D2B;
    --ok:#5AC48C; --ok-soft:#12291D; --check:#E8A93E; --check-soft:#30230B;
    --g0:#6E9FE8; --g1:#F29A4B; --g2:#47C2AC; --g3:#E27DB6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#151920; --surface-2:#1C212A; --plot:#0A0C10;
  --ink:#E5E8EE; --ink-2:#B3BAC7; --muted:#8690A2; --line:#283039; --line-2:#3A4351;
  --accent:#9D92FF; --accent-soft:#231E4A; --accent-ink:#110D2B;
  --ok:#5AC48C; --ok-soft:#12291D; --check:#E8A93E; --check-soft:#30230B;
  --g0:#6E9FE8; --g1:#F29A4B; --g2:#47C2AC; --g3:#E27DB6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.015em;line-height:1.15}
h3{font-size:15px;font-weight:600}
p{margin:0}
sup{font-size:.72em;line-height:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--ink-2);max-width:68ch}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand .name{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12px}
.switch{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;flex-wrap:wrap}
.switch button{border:0;background:transparent;border-radius:7px;padding:5px 12px;text-align:left;color:var(--ink-2);cursor:pointer;min-height:44px}
.switch button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.switch b{display:block;font-weight:600;font-size:13px}
.switch small{display:block;font-size:11px;color:var(--muted)}
.sim{font-family:var(--font-mono);font-size:11px;color:var(--check);background:var(--check-soft);padding:3px 9px;border-radius:999px;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px 9px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;min-height:44px;display:flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{font-family:var(--font-mono);font-size:11px;background:var(--check-soft);color:var(--check);border-radius:999px;padding:0 7px;line-height:18px}
.badge:empty{display:none}
main{padding-block:22px 56px}
.panel-head{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}

/* controls */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 13px;min-height:40px;cursor:pointer;font-weight:500;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-block:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card > h3{margin-bottom:10px}
.count{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;min-height:36px}

/* gate review */
.gates-layout{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:20px;align-items:start}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-size:12px}
.stat.s-ok b{color:var(--ok)} .stat.s-check b{color:var(--check)} .stat.s-mine b{color:var(--accent)}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12px;margin-bottom:10px}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;display:inline-block;flex:none;border-radius:50%;background:var(--muted)}
.d-ref{background:transparent;border:2px solid var(--accent)}
.d-ok{background:var(--ok)}
.d-check{background:var(--check);border-radius:1px;transform:rotate(45deg) scale(.9)}
.d-approved{background:var(--ok);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ok);transform:scale(.75)}
.d-edited{background:var(--accent);border-radius:2px}
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ggrid{border-collapse:separate;border-spacing:0}
.ggrid thead th{font-weight:600;text-align:left;padding:10px 8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.ggrid thead th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.ggrid td{padding:3px;border-bottom:1px solid var(--line)}
.ggrid tr:last-child td,.ggrid tr:last-child th{border-bottom:0}
.rowh{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:8px 12px;min-width:132px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:400}
.rowh b{display:block;font-weight:600;font-size:13px;white-space:nowrap}
.rowh small{display:block;color:var(--muted);font-size:11px;white-space:nowrap}
.tag{display:inline-block;margin-top:3px;font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px}
.cell{display:flex;flex-direction:column;gap:3px;padding:4px;border:1.5px solid transparent;border-radius:8px;background:none;cursor:pointer}
.cell:hover{border-color:var(--line-2)}
.cell canvas{width:84px;height:84px;display:block;border-radius:3px}
.cap{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:11px;padding-inline:2px}
.cap b{font-weight:500;font-variant-numeric:tabular-nums}
.cell.s-check{border-color:var(--check);background:var(--check-soft)}
.cell.sel{outline:2.5px solid var(--accent);outline-offset:1px}
.steps{margin-top:16px}
.steps summary{cursor:pointer;font-weight:600;padding:2px 0}
.steps ol{list-style:none;margin:10px 0 12px;padding:0;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;font-size:13px;color:var(--ink-2)}
.steps time{font-family:var(--font-mono);font-size:11px;color:var(--muted);padding-top:2px}

.inspector{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.ins-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ins-head h3{font-family:var(--font-display);font-size:22px;font-weight:700}
.meta{color:var(--muted);font-size:12px}
.pill{font-family:var(--font-mono);font-size:11px;border-radius:999px;padding:2px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor}
.pill.ref{color:var(--accent)} .pill.ok{color:var(--ok)} .pill.check{color:var(--check);background:var(--check-soft)} .pill.approved{color:var(--ok);background:var(--ok-soft)} .pill.edited{color:var(--accent);background:var(--accent-soft)}
.plotbox canvas{display:block;width:100%;touch-action:none;border-radius:6px}
.ins-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.ins-stats div{background:var(--surface-2);border-radius:8px;padding:7px 9px;min-width:0}
.ins-stats dt{font-size:11px;color:var(--muted)}
.ins-stats dd{margin:0;font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.notes li{font-size:13px;color:var(--ink-2);padding-left:14px;position:relative}
.notes li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--line-2)}
.notes.check li:first-child{color:var(--ink)}
.notes.check li:first-child::before{background:var(--check)}
.ins-actions{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:12px;color:var(--muted)}
.ins-nav{display:flex;justify-content:space-between;gap:8px}

/* results */
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--surface)}
.chip b{font-weight:600}
.chip.muted{color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;background:var(--check-soft);border:1px solid var(--check);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.card header h3{font-family:var(--font-display);font-size:19px;font-weight:700}
.unit{color:var(--muted);font-size:12px}
.chart{overflow-x:auto}
.chart svg{display:block;max-width:100%;height:auto}
.rowtitle{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:8px}
.statlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.statlist b{color:var(--ink);font-weight:600}
.mono{font-family:var(--font-mono);font-size:12px}
pre.table{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);border-radius:8px;padding:10px 12px;overflow:auto;max-height:260px;margin:8px 0 0;white-space:pre}
details.prism{margin-top:10px}
details.prism summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.robust{grid-column:1 / -1}
.verdict{font-size:14px;margin-top:6px}
.verdict b{font-weight:600}
.lockrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.lockrow .warn{color:var(--check)}
.stepbtns{display:flex;flex-wrap:wrap;gap:4px}
svg .ax{fill:var(--muted);font-family:var(--font-mono);font-size:10px}
svg .lbl{fill:var(--ink-2);font-family:var(--font-body);font-size:11px}
svg .lblb{fill:var(--ink);font-family:var(--font-body);font-size:11.5px;font-weight:600}
svg .grid{stroke:var(--line);stroke-width:1}
svg .zero{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:4 3}

/* explore */
.ex-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.tree ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tree button{width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px 7px calc(8px + var(--d,0) * 14px);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:40px}
.tree button:hover{background:var(--surface-2)}
.tree button[aria-current="true"]{background:var(--accent-soft)}
.tree b{font-weight:600}
.tree small{display:block;color:var(--muted);font-size:11px}
.flagn{font-family:var(--font-mono);font-size:11px;color:var(--check);background:var(--check-soft);border-radius:999px;padding:0 6px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.ex-head label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.ex-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
figure{margin:0}
figcaption{font-size:13px;color:var(--ink-2);margin-bottom:8px}
#ex-overlay{display:block;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
.ridge svg{display:block;width:100%;height:auto}
.ridge .rrow{cursor:pointer}
.ridge .rrow:hover .hit,.ridge .rrow:focus .hit{fill:var(--surface-2)}
.ridge .rrow:focus{outline:none}

/* agent */
.ag-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.tools{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.tools code{font-family:var(--font-mono);font-size:12px;color:var(--accent)}
.tools span{display:block;font-size:12px;color:var(--ink-2)}
.ag-note{font-size:12px;color:var(--muted);margin-bottom:10px}
.chat{display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
.msg-q{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px;padding:8px 13px;max-width:80%}
.msg-a{display:flex;flex-direction:column;gap:8px;min-width:0}
.call{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-family:var(--font-mono);font-size:12px;background:var(--surface-2);border-radius:8px;padding:6px 10px;color:var(--ink-2);overflow-wrap:anywhere}
.call .fn{color:var(--accent);font-weight:500}
.reply{font-size:14px;max-width:75ch}
.ag-form{display:flex;gap:8px}
.ag-form input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;min-height:44px}
.prompts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini-table{border-collapse:collapse;font-size:13px;width:100%}
.mini-table th,.mini-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.mini-table th{font-size:11px;color:var(--muted);font-weight:500}

/* study sheet */
.st-layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.tablewrap{overflow-x:auto}
.sheet{border-collapse:collapse;width:100%;font-size:13px}
.sheet th,.sheet td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.sheet thead th{font-size:12px;color:var(--muted);font-weight:500}
.sheet td.mono{font-variant-numeric:tabular-nums}
.role{font-family:var(--font-mono);font-size:10px;border-radius:4px;padding:0 5px;margin-left:6px;background:var(--surface-2);color:var(--ink-2)}
.role.compare{background:var(--accent-soft);color:var(--accent)}
.roles{display:flex;flex-direction:column;gap:10px}
.roles .r{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px;align-items:center}
.roles .r b{display:block}
.roles .r small{display:block;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.built{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.built li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;font-size:13px;color:var(--ink-2)}
.built li b{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-weight:500;padding-top:2px;text-transform:uppercase;letter-spacing:.04em}

/* toast + modal */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:13px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:30}
#modal{position:fixed;inset:0;background:rgba(10,12,16,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
#modal .card{max-width:780px;width:100%;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:10px}
#modal pre{max-height:50vh}

@media (max-width:1100px){
  .gates-layout,.st-layout,.ag-layout{grid-template-columns:minmax(0,1fr)}
  .inspector{position:static}
  .ex-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .ex-layout{grid-template-columns:minmax(0,1fr)}
  h2{font-size:22px}
  .brand .sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="14" cy="14" r="11.5"/><circle cx="14" cy="14" r="3"/><path d="M14 2.5v8.5M14 17v8.5M2.5 14h8.5M17 14h8.5M5.9 5.9l6 6M16.1 16.1l6 6M22.1 5.9l-6 6M11.9 16.1l-6 6"/></svg>
      <span class="name">Wheelwright</span>
      <span class="sub">flow cytometry analysis, built from your study sheet</span>
    </div>
    <div class="switch" role="radiogroup" aria-label="Study">
      <button role="radio" data-study="treg" aria-checked="true"><b>Treg infiltration</b><small>3 donors · control vs treated</small></button>
      <button role="radio" data-study="cart" aria-checked="false"><b>CAR-T biodistribution</b><small>12 mice · 3 tissues · 2 days</small></button>
    </div>
    <span class="sim">Simulated example data</span>
  </div>
  <nav class="wrap tabs" role="tablist" aria-label="Workspace">
    <button role="tab" data-tab="study" aria-selected="false">Study sheet</button>
    <button role="tab" data-tab="gates" aria-selected="true">Gate review <span class="badge" id="badge"></span></button>
    <button role="tab" data-tab="results" aria-selected="false">Results</button>
    <button role="tab" data-tab="explore" aria-selected="false">Explore</button>

  </nav>

const LUT=(()=>{ const st=[[0,[40,52,190]],[0.22,[20,150,225]],[0.45,[40,185,95]],[0.7,[245,205,35]],[1,[226,38,28]]], out=[];
  for(let i=0;i<256;i++){ const t=i/255; let k=0; while(k<st.length-2&&t>st[k+1][0]) k++; const [t0,c0]=st[k],[t1,c1]=st[k+1], f=(t-t0)/(t1-t0); out.push([0,1,2].map(j=>Math.round(c0[j]+(c1[j]-c0[j])*f))); } return out; })();

  return {placed:(S.samples.length-1)*S.gates.length,ok,check,mine}; }
function nextFlag(si0,gi0){ const S=W.study, st=W.st, N=S.samples.length, G=S.gates.length, start=si0*G+gi0;
  for(let k=1;k<=N*G;k++){ const j=(start+k+N*G)%(N*G), si=Math.floor(j/G), g=S.gates[j%G]; if(si===0) continue; const s=st.gs[si][g.id]; if(s.status==='auto'&&s.conf==='check') return {si,gid:g.id}; }

/* ---------- plotting ---------- */
function niceTicks(max){ if(!(max>0)) max=1; const raw=max/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/mag; const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag; const top=Math.ceil(max/step-1e-9)*step; const t=[]; for(let v=0;v<=top+1e-9;v+=step) t.push(+v.toFixed(6)); return {ticks:t,top}; }
function axisTicks(ch){ return ch.kind==='scatter'?[[0,'0'],[50,'50K'],[100,'100K'],[150,'150K'],[200,'200K'],[250,'250K']]:[[0,'0'],[2,'10²'],[3,'10³'],[4,'10⁴'],[5,'10⁵']]; }
function plotFrame(cv,cx,cy,o){
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth||o.w||84, h=cv.clientHeight||o.h||84;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const C=colors(), m=o.mini?{l:0,r:0,t:0,b:0}:{l:50,r:12,t:12,b:40}, pw=w-m.l-m.r, ph=h-m.t-m.b;
  const [x0,x1]=Eng.chRange(cx), [y0,y1]=Eng.chRange(cy);
  const map={m,pw,ph,w,h,x0,x1,y0,y1,v2x:v=>m.l+(v-x0)/(x1-x0)*pw,v2y:v=>m.t+ph-(v-y0)/(y1-y0)*ph,x2v:px=>x0+(px-m.l)/pw*(x1-x0),y2v:py=>y0+(m.t+ph-py)/ph*(y1-y0)};
  ctx.clearRect(0,0,w,h); ctx.fillStyle=C.plot; ctx.fillRect(m.l,m.t,pw,ph);
  return {ctx,map,C};
}
function plotAxes(ctx,map,cx,cy,C){
  const {m,pw,ph}=map; ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.strokeRect(m.l+.5,m.t+.5,pw-1,ph-1);
  ctx.fillStyle=C.muted; ctx.font='10px "IBM Plex Mono", ui-monospace, monospace';
  ctx.textAlign='center'; ctx.textBaseline='top';
  axisTicks(cx).forEach(([v,l])=>{ const x=map.v2x(v); if(x<m.l-1||x>m.l+pw+1) return; ctx.fillRect(x,m.t+ph,1,4); ctx.fillText(l,x,m.t+ph+6); });
  ctx.textAlign='right'; ctx.textBaseline='middle';
  axisTicks(cy).forEach(([v,l])=>{ const y=map.v2y(v); if(y<m.t-1||y>m.t+ph+1) return; ctx.fillRect(m.l-4,y,4,1); ctx.fillText(l,m.l-6,y); });
  ctx.fillStyle=C.ink2; ctx.font='11px "IBM Plex Sans", system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  const lab=c=>c.kind==='scatter'?c.id:`${c.label} · ${c.fluor}`;
  ctx.fillText(lab(cx),m.l+pw/2,map.h-2);
  ctx.save(); ctx.translate(11,m.t+ph/2); ctx.rotate(-Math.PI/2); ctx.textBaseline='middle'; ctx.fillText(lab(cy),0,0); ctx.restore();
}
function gateRegion(g,p,map){ // kept region as pixel rect for threshold gates
  let xa=map.x0,xb=map.x1,ya=map.y0,yb=map.y1;
  g.conds.forEach((c,k)=>{ const t=p.ts[k]; if(c.ch===g.x){ if(c.op==='>') xa=t; else xb=t; } else if(c.ch===g.y){ if(c.op==='>') ya=t; else yb=t; } });
  return {X0:map.v2x(xa),X1:map.v2x(xb),Y0:map.v2y(yb),Y1:map.v2y(ya)};
}
function drawGateShape(ctx,g,p,map,C,o){
  const {m,pw,ph}=map; ctx.save(); ctx.beginPath(); ctx.rect(m.l,m.t,pw,ph); ctx.clip();
  ctx.strokeStyle=o.color||C.ink; ctx.lineWidth=o.mini?1.2:1.7; ctx.setLineDash(o.dash||[]);
  let anchor=[m.l+6,m.t+6];
  if(g.type==='rect'){ const X0=map.v2x(p.r[0]),X1=map.v2x(p.r[1]),Y0=map.v2y(p.r[3]),Y1=map.v2y(p.r[2]);
    if(o.fill){ ctx.globalAlpha=.09; ctx.fillStyle=C.accent; ctx.fillRect(X0,Y0,X1-X0,Y1-Y0); ctx.globalAlpha=1; } ctx.strokeRect(X0,Y0,X1-X0,Y1-Y0); anchor=[X0+4,Y0+4]; }
  else if(g.type==='ratio'){ const t=p.t, A=[map.v2x(map.x0),map.v2y(t*map.x0)], B=[map.v2x(map.x1),map.v2y(t*map.x1)];
    if(o.fill){ ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(map.v2x(map.x1),map.v2y(map.y1)); ctx.lineTo(map.v2x(map.x0),map.v2y(map.y1)); ctx.closePath(); ctx.globalAlpha=.07; ctx.fillStyle=C.accent; ctx.fill(); ctx.globalAlpha=1; }
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke(); }
  else { const R=gateRegion(g,p,map);
    if(o.fill){ ctx.globalAlpha=.09; ctx.fillStyle=C.accent; ctx.fillRect(R.X0,R.Y0,R.X1-R.X0,R.Y1-R.Y0); ctx.globalAlpha=1; }
    g.conds.forEach((c,k)=>{ ctx.beginPath(); if(c.ch===g.x){ const x=map.v2x(p.ts[k]); ctx.moveTo(x,m.t); ctx.lineTo(x,m.t+ph); } else { const y=map.v2y(p.ts[k]); ctx.moveTo(m.l,y); ctx.lineTo(m.l+pw,y); } ctx.stroke(); });
    anchor=[Math.max(m.l,R.X0)+5,Math.max(m.t,R.Y0)+5]; }
  ctx.restore(); return anchor;
}
function drawGatePlot(cv,si,g,p,o){
  const S=W.study, st=W.st, cx=S.ch[g.x], cy=S.ch[g.y];
  const {ctx,map,C}=plotFrame(cv,cx,cy,o);
  const par=Eng.parentIdx(st,si,g), d=st.data[si].ch, X=d[g.x], Y=d[g.y];
  const bs=o.mini?2:2.5, nx=Math.max(8,Math.floor(map.pw/bs)), ny=Math.max(8,Math.floor(map.ph/bs));
  const grid=new Uint32Array(nx*ny); let mx=0;
  const fx=nx/(map.x1-map.x0), fy=ny/(map.y1-map.y0);
  for(let k=0;k<par.length;k++){ const i=par[k], bx=Math.floor((X[i]-map.x0)*fx), by=Math.floor((Y[i]-map.y0)*fy); if(bx<0||bx>=nx||by<0||by>=ny) continue; const j=(ny-1-by)*nx+bx, c=++grid[j]; if(c>mx) mx=c; }
  if(OFF.width<nx) OFF.width=nx; if(OFF.height<ny) OFF.height=ny;
  const img=OCTX.createImageData(nx,ny), lm=Math.log(1+mx)||1;
  for(let j=0;j<grid.length;j++){ const c=grid[j]; if(!c) continue; const col=LUT[Math.min(255,Math.floor(Math.log(1+c)/lm*255))]; img.data[j*4]=col[0]; img.data[j*4+1]=col[1]; img.data[j*4+2]=col[2]; img.data[j*4+3]=255; }
  OCTX.clearRect(0,0,OFF.width,OFF.height); OCTX.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=false; ctx.drawImage(OFF,0,0,nx,ny,map.m.l,map.m.t,map.pw,map.ph);
  if(o.template) drawGateShape(ctx,g,o.template,map,C,{dash:[4,4],color:C.muted,mini:o.mini});
  const anchor=drawGateShape(ctx,g,p,map,C,{fill:!o.mini,mini:o.mini,color:o.active?C.accent:C.ink});
  if(!o.mini){
    plotAxes(ctx,map,cx,cy,C);
    const n=o.count!=null?o.count:W.st.idx[si][g.id].length, label=`${g.name}  ${fmtPct(par.length?100*n/par.length:0)}`;
    ctx.font='500 11px "IBM Plex Mono", ui-monospace, monospace'; const tw=ctx.measureText(label).width;
    const ax=Math.min(anchor[0],map.m.l+map.pw-tw-12), ay=Math.min(anchor[1],map.m.t+map.ph-22);
    ctx.globalAlpha=.88; ctx.fillStyle=C.surface; ctx.fillRect(ax,ay,tw+10,18); ctx.globalAlpha=1;
    ctx.fillStyle=C.ink; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(label,ax+5,ay+9.5);
  } else { ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.strokeRect(.5,.5,map.w-1,map.h-1); }
  cv._map=map; return map;
}

function hitTest(g,p,map,px,py){
  if(g.type==='thr'){ for(let k=0;k<g.conds.length;k++){ const c=g.conds[k]; if(c.ch===g.x&&Math.abs(map.v2x(p.ts[k])-px)<9) return {kind:'v',k,cursor:'ew-resize'}; if(c.ch===g.y&&Math.abs(map.v2y(p.ts[k])-py)<9) return {kind:'h',k,cursor:'ns-resize'}; } return null; }
  if(g.type==='ratio'){ const yv=p.t*map.x2v(px); return Math.abs(map.v2y(yv)-py)<11?{kind:'ratio',cursor:'grab'}:null; }
  const X0=map.v2x(p.r[0]),X1=map.v2x(p.r[1]),Yt=map.v2y(p.r[3]),Yb=map.v2y(p.r[2]);
  const inY=py>Yt-6&&py<Yb+6, inX=px>X0-6&&px<X1+6;
  if(inY&&Math.abs(px-X0)<7) return {kind:'e',e:0,cursor:'ew-resize'};
  if(inY&&Math.abs(px-X1)<7) return {kind:'e',e:1,cursor:'ew-resize'};
  if(inX&&Math.abs(py-Yb)<7) return {kind:'e',e:2,cursor:'ns-resize'};
  if(inX&&Math.abs(py-Yt)<7) return {kind:'e',e:3,cursor:'ns-resize'};
  if(px>X0&&px<X1&&py>Yt&&py<Yb) return {kind:'move',cursor:'move'};

}
function bindBig(cv,si,g){
  const st=W.st, S=W.study, live=Eng.cloneP(st.gs[si][g.id].p), tmpl=si===0?null:st.gs[0][g.id].p;

  let drag=null, changed=false, keyT=null;
  const redraw=()=>{ const par=Eng.parentIdx(st,si,g), n=Eng.filterIdx(st,si,g,live,par).length;
    drawGatePlot(cv,si,g,live,{count:n,template:tmpl,active:!!drag});
    $('#ins-n').textContent=fmtN(n); $('#ins-pct').textContent=fmtPct(par.length?100*n/par.length:0); $('#ins-pos').innerHTML=paramsHTML(S,g,live); };

    else if(h.kind==='h') live.ts[h.k]=clampF(map.y2v(py),g.y);
    else if(h.kind==='ratio'){ const xv=map.x2v(px), yv=map.y2v(py); if(xv>5) live.t=Math.max(0.3,Math.min(1.15,yv/xv)); }
    else if(h.kind==='move'){ const dx=map.x2v(px)-map.x2v(drag.sx), dy=map.y2v(py)-map.y2v(drag.sy); live.r=[drag.p0.r[0]+dx,drag.p0.r[1]+dx,drag.p0.r[2]+dy,drag.p0.r[3]+dy]; }
    else if(h.kind==='e'){ const r=live.r; if(h.e===0) r[0]=Math.min(map.x2v(px),r[1]-5); if(h.e===1) r[1]=Math.max(map.x2v(px),r[0]+5); if(h.e===2) r[2]=Math.min(map.y2v(py),r[3]-5); if(h.e===3) r[3]=Math.max(map.y2v(py),r[2]+5); }

}

function rowSVG(an,cells,ro){

  const left=54, top=20+nT*17, ph=170, bottom=an.sx?48:30;

  const {ticks,top:ymax}=niceTicks(mx*1.04||1), y=v=>top+ph-(v/ymax)*ph;
  const out=[`<svg viewBox="0 0 ${Wd} ${H}" width="${Wd}" role="img" aria-label="${esc(ro.name)}, ${esc(ro.unit)}, by ${esc(an.C.id)}">`];
  ticks.forEach(t=>{ out.push(`<line class="grid" x1="${left}" x2="${Wd-8}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${left-6}" y="${y(t)+3}" text-anchor="end">${+t.toFixed(3)}</text>`); });
  out.push(`<text class="ax" transform="translate(12 ${top+ph/2}) rotate(-90)" text-anchor="middle">${esc(ro.unit)}</text>`);
  cells.forEach((c,ci)=>{
    const gx=left+12+ci*(gw+go), cxs=c.groups.map((g,li)=>gx+li*(bw+gi)+bw/2), paired=c.tests[0]&&c.tests[0].kind==='paired';
    if(paired){ const units=c.groups[0].units.map(u=>u.unit); units.forEach(u=>{ const pts=c.groups.map((g,li)=>{ const z=g.units.find(q=>q.unit===u); return z?`${cxs[li]},${y(z.v)}`:null; }).filter(Boolean); if(pts.length>1) out.push(`<polyline points="${pts.join(' ')}" fill="none" style="stroke:var(--line-2)" stroke-width="1.3"/>`); }); }

        if(gr.units.length>1){ const a=y(gr.mean+gr.sd), b=y(Math.max(0,gr.mean-gr.sd)); out.push(`<path d="M${cxs[li]} ${a}V${b}M${cxs[li]-6} ${a}H${cxs[li]+6}M${cxs[li]-6} ${b}H${cxs[li]+6}" style="stroke:var(--ink-2)" stroke-width="1.2" fill="none"/>`); }
        gr.units.forEach((u,k)=>{ const off=paired?0:(k-(gr.units.length-1)/2)*7; out.push(`<circle cx="${cxs[li]+off}" cy="${y(u.v)}" r="3.6" style="fill:${col};stroke:var(--surface)" stroke-width="1.2"><title>${esc(u.unit)}: ${fmtV(u.v,ro)}</title></circle>`); });
      } else out.push(`<text class="ax" x="${cxs[li]}" y="${y(0)-6}" text-anchor="middle">too few</text>`);
      out.push(`<text class="lbl" x="${cxs[li]}" y="${top+ph+15}" text-anchor="middle">${esc(gr.level)}</text>`);
    });
    if(an.sx) out.push(`<text class="lblb" x="${gx+gw/2}" y="${top+ph+36}" text-anchor="middle">${esc(c.x)}</text>`);
    c.tests.forEach((t,j)=>{ if(!t.ok) return; const by=top-8-j*17, a=cxs[0], b=cxs[j+1];
      out.push(`<path d="M${a} ${by+5}V${by}H${b}V${by+5}" fill="none" style="stroke:var(--ink-2)" stroke-width="1"/><text class="ax" x="${(a+b)/2}" y="${by-3}" text-anchor="middle">${fmtP(t.p)}</text>`); });

function testLines(an,cells,ro,d){

function fmtLine(t){ return sup(t).replace('<sup>'+t.toFixed(2),'<sup>'+t.toFixed(1)); }
function robustSVG(steps,ro){

function niceTicksRange(lo,hi){ const raw=(hi-lo)/4, mag=Math.pow(10,Math.floor(Math.log10(raw||1))), f=raw/mag, step=(f<=1?1:f<=2?2:f<=5?5:10)*mag, o=[]; for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step) o.push(+v.toFixed(6)); return o; }

function moveSweep(dl){
  const S=W.study, st=W.st, sw=S.sweep, ch=S.ch[S.G[sw.gate].conds[sw.cond].ch], items=[];
  S.samples.forEach((s,si)=>{ items.push(snapshot(si,sw.gate)); const cur=st.gs[si][sw.gate], p=Eng.cloneP(cur.p); p.ts[sw.cond]+=dl; st.gs[si][sw.gate]=Object.assign({},cur,{p,status:si===0?'ref':'edited',conf:si===0?'ref':'edited'}); });
  W.undo.push({items}); Eng.runAuto(st);
  log(`Moved the ${esc(ch.label)} line by ${dl>0?'+':'−'}${Math.abs(dl).toFixed(1)} decades on all ${S.samples.length} samples, after viewing results.`);
  updateBadge(); renderResults(); toast(`Moved the ${ch.label} line on every sample. It's in Steps, and Undo reverses it.`);
}

/* ---------- explore ---------- */
function renderExplore(){
  const S=W.study, st=W.st, el=$('#tab-explore'), g=S.G[W.explore.gid];
  const colorF=S.factors.filter(f=>f.levels.length>=2&&f.levels.length<=4);
  if(!colorF.find(f=>f.id===W.explore.colorBy)) W.explore.colorBy=colorF[0].id;
  const cf=S.factorMap[W.explore.colorBy];
  const tree=S.gates.map(gg=>{ const pcts=S.samples.map((s,si)=>{ const p=Eng.parentIdx(st,si,gg).length; return p?100*st.idx[si][gg.id].length/p:0; }); const fl=S.samples.filter((s,si)=>si>0&&st.gs[si][gg.id].status==='auto'&&st.gs[si][gg.id].conf==='check').length;
    return `<li><button style="--d:${gg.depth}" data-g="${gg.id}" aria-current="${gg.id===g.id}"><span><b>${esc(gg.name)}</b><small>${fmtPct(Eng.mean(pcts))} of ${esc(parentName(gg))}, mean</small></span>${fl?`<i class="flagn">${fl}</i>`:''}</button></li>`; }).join('');
  el.innerHTML=`<div class="panel-head"><p class="eyebrow">Will's ask C · see the raw data</p><h2>Explore</h2><p class="lede">Pick a gate in the tree. Left: every sample's cells at that step, overlaid. Right: one row per sample, so drift between samples and the line each one got are visible at a glance.</p></div>
  <div class="ex-layout"><nav class="card tree" aria-label="Gating tree"><h3>Gating tree</h3><ul>${tree}</ul></nav>
  <div style="min-width:0"><div class="ex-head"><h3>${esc(g.name)} <span class="unit">on ${esc(g.x)} × ${esc(g.y)}, from ${esc(parentName(g))}</span></h3>
    <label for="ex-color">Colour by <select id="ex-color">${colorF.map(f=>`<option value="${f.id}" ${f.id===cf.id?'selected':''}>${esc(f.id)}</option>`).join('')}</select></label></div>
  <div class="ex-grid"><figure class="card"><figcaption>All ${S.samples.length} samples overlaid. Dashed: the template gate.</figcaption><canvas id="ex-overlay"></canvas>
    <div class="legend">${cf.levels.map((l,i)=>`<span><i style="background:var(--g${i})"></i>${esc(l)}</span>`).join('')}</div></figure>
  <figure class="card"><figcaption>${esc(ridgeLabel(g))} in each sample. Dark tick: where that sample's gate landed. Click a row to review it.</figcaption><div class="ridge">${ridgeSVG(g,cf)}</div></figure></div></div></div>`;
  $$('.tree [data-g]',el).forEach(b=>b.onclick=()=>{ W.explore.gid=b.dataset.g; renderExplore(); });
  $('#ex-color').onchange=e=>{ W.explore.colorBy=e.target.value; renderExplore(); };
  $$('.rrow',el).forEach(r=>{ const go=()=>{ W.sel={si:+r.dataset.si,gid:g.id}; setTab('gates'); }; r.onclick=go; r.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } }; });
  const cv=$('#ex-overlay'), w=Math.max(260,cv.parentElement.clientWidth-36); cv.style.width=w+'px'; cv.style.height=Math.round(Math.min(460,w*0.8))+'px';
  drawOverlay(cv,g,cf);
}
function ridgeLabel(g){ const S=W.study; if(g.type==='ratio') return 'FSC-H ÷ FSC-A'; if(g.type==='rect') return g.x; const c=S.ch[g.conds[0].ch]; return c.label; }
function drawOverlay(cv,g,cf){
  const S=W.study, st=W.st, {ctx,map,C}=plotFrame(cv,S.ch[g.x],S.ch[g.y],{});
  ctx.save(); ctx.beginPath(); ctx.rect(map.m.l,map.m.t,map.pw,map.ph); ctx.clip(); ctx.globalAlpha=.34;
  S.samples.forEach((s,si)=>{ const par=Eng.parentIdx(st,si,g), d=st.data[si].ch, X=d[g.x], Y=d[g.y], step=Math.max(1,Math.floor(par.length/1400));
    ctx.fillStyle=C.grp[cf.levels.indexOf(s.meta[cf.id])%4];
    for(let k=0;k<par.length;k+=step){ const i=par[k]; ctx.fillRect(map.v2x(X[i])-.8,map.v2y(Y[i])-.8,1.7,1.7); } });
  ctx.restore();
  drawGateShape(ctx,g,st.gs[0][g.id].p,map,C,{dash:[5,4],color:C.ink});
  plotAxes(ctx,map,S.ch[g.x],S.ch[g.y],C);
}
function ridgeSVG(g,cf){
  const S=W.study, st=W.st; let range,getV,marks;
  if(g.type==='ratio'){ range=[0.3,1.15]; getV=(si,par)=>Eng.ratioVals(st,si,g,par); marks=p=>[p.t]; }
  else if(g.type==='rect'){ range=Eng.chRange(S.ch[g.x]); getV=(si,par)=>Eng.vals(st,si,g.x,par); marks=p=>[p.r[0],p.r[1]]; }
  else { const c=S.ch[g.conds[0].ch]; range=Eng.chRange(c); getV=(si,par)=>Eng.vals(st,si,c.id,par); marks=p=>[p.ts[0]]; }
  const rowH=24, peak=30, left=112, right=12, top=8, Wd=620, pw=Wd-left-right, N=S.samples.length, H=top+peak+N*rowH+30;
  const xs=v=>left+(v-range[0])/(range[1]-range[0])*pw, out=[`<svg viewBox="0 0 ${Wd} ${H}" role="group" aria-label="${esc(ridgeLabel(g))} per sample">`];
  marks(st.gs[0][g.id].p).forEach(v=>out.push(`<line x1="${xs(v)}" x2="${xs(v)}" y1="${top}" y2="${top+peak+N*rowH}" style="stroke:var(--accent)" stroke-dasharray="4 4" stroke-width="1.2"/>`));
  S.samples.forEach((s,si)=>{
    const par=Eng.parentIdx(st,si,g), base=top+peak+si*rowH, col=`var(--g${cf.levels.indexOf(s.meta[cf.id])%4})`, gs=st.gs[si][g.id], flag=gs.status==='auto'&&gs.conf==='check';
    let path='';
    if(par.length>5){ const K=Eng.kde1(getV(si,par),range[0],range[1],120); let mx=0; for(let b=0;b<K.nb;b++) mx=Math.max(mx,K.s[b]);
      path=`M${left} ${base}`; for(let b=0;b<K.nb;b++) path+=`L${xs(K.x(b)).toFixed(1)} ${(base-(mx?K.s[b]/mx:0)*peak).toFixed(1)}`; path+=`L${left+pw} ${base}Z`; }
    out.push(`<g class="rrow" data-si="${si}" tabindex="0" role="button" aria-label="${esc(s.label)}${flag?', flagged':''}. Review this gate."><rect class="hit" x="0" y="${base-rowH}" width="${Wd}" height="${rowH}" fill="transparent"/>`);
    if(path) out.push(`<path d="${path}" style="fill:${col};fill-opacity:.26;stroke:${col}" stroke-width="1.2"/>`);
    marks(gs.p).forEach(v=>out.push(`<line x1="${xs(v)}" x2="${xs(v)}" y1="${base}" y2="${base-peak*.85}" style="stroke:var(--ink)" stroke-width="2"/>`));
    out.push(`<text class="lbl" x="${left-10}" y="${base-5}" text-anchor="end">${esc(s.label)}</text>`);
    if(flag) out.push(`<rect x="${left-7}" y="${base-12}" width="6" height="6" transform="rotate(45 ${left-4} ${base-9})" style="fill:var(--check)"/>`);
    out.push('</g>');
  });
  const ticks=g.type==='ratio'?[[0.4,'0.4'],[0.6,'0.6'],[0.8,'0.8'],[1.0,'1.0']]:axisTicks(g.type==='rect'?S.ch[g.x]:S.ch[g.conds[0].ch]);
  const yb=top+peak+N*rowH+4; out.push(`<line x1="${left}" x2="${left+pw}" y1="${yb}" y2="${yb}" style="stroke:var(--line-2)"/>`);
  ticks.forEach(([v,l])=>out.push(`<text class="ax" x="${xs(v)}" y="${yb+14}" text-anchor="middle">${l}</text>`));
  out.push('</svg>'); return out.join('');
}

/* ---------- agent ---------- */
const TOOLS=[['list_samples','()','The study sheet: every sample and what it is.'],['get_gate_tree','()','Gates, parents, channels and template positions.'],['review_gates','(status?)','Gates the auto-placer flagged, with its reason for each.'],['set_gate','(sample, gate, line)','Move a gate line on one sample. Logged as a step you can undo.'],['get_stats','(readout, filters?)','One value per sample, counted from the current gates.'],['compare_groups','(readout, filters?)','The comparison the study sheet implies, with a 95% interval.'],['check_robustness','(readout)','The effect at every position of the judgement-call line.'],['set_roles','(roles)','Change what is compared, paired or split.'],['export_prism','(readout)','A table that pastes straight into Prism.']];
function matchReadout(q){ const S=W.study; let best=null,bs=0; S.readouts.forEach(ro=>{ const s=ro.keys.filter(k=>q.includes(k)).length; if(s>bs){ bs=s; best=ro; } }); return best; }
function matchFilters(q){ const S=W.study, f={}; S.factors.forEach(F=>{ if(F.levels.length>4) return; F.levels.forEach(l=>{ const L=l.toLowerCase(); if(q.includes(L)||(L==='tumour'&&q.includes('tumor'))) f[F.id]=l; }); }); return f; }
function callHTML(fn,args){ return `<div class="call"><span class="fn">${fn}</span><span>${esc(JSON.stringify(args))}</span></div>`; }
function agentAsk(text){
  const S=W.study, st=W.st, q=text.toLowerCase(), m={q:text,parts:[]}; const say=h=>m.parts.push(`<p class="reply">${h}</p>`), call=(f,a)=>m.parts.push(callHTML(f,a)), add=h=>m.parts.push(h);
  const d=Eng.describeDesign(S,W.roles);
  try{
    const setM=q.match(/(?:to|at)\s*(?:10\^)?(-?\d+(?:\.\d+)?)\s*$/);
    if(/\b(set|move|put)\b/.test(q)&&setM){
      const s=S.samples.find(x=>q.includes(x.id.toLowerCase())||q.includes(x.label.toLowerCase())); const g=S.gates.slice().sort((a,b)=>b.name.length-a.name.length).find(x=>q.includes(x.name.toLowerCase()));
      const v=parseFloat(setM[1]);
      if(!s||!g){ say('Name a sample and a gate, for example “Set the CD3+ line on D02 Treated to 2.0”.'); }
      else if(g.type!=='thr'){ say(`${esc(g.name)} isn’t a single line. Drag it in Gate review instead.`); }
      else { const si=S.samples.indexOf(s); call('set_gate',{sample:s.id,gate:g.name,line:v}); const p=Eng.cloneP(st.gs[si][g.id].p); p.ts[0]=v;
        commitEdit(si,g.id,p,`Agent moved ${esc(g.name)} on ${esc(s.label)} to ${lineHTML(S.ch[g.conds[0].ch],v)}, on your request.`);
        const par=Eng.parentIdx(st,si,g).length, n=st.idx[si][g.id].length;
        say(`Moved the ${esc(S.ch[g.conds[0].ch].label)} line on ${esc(s.label)} to ${sup(v)}. ${esc(g.name)} is now ${fmtPct(par?100*n/par:0)} of ${esc(parentName(g))}, and everything below it was recounted. It’s in Steps, so Undo in Gate review reverses it.`); }
    }
    else if(/\b(check|flag|flagged|review|unsure|confiden|wrong)/.test(q)){
      call('review_gates',{status:'flagged'}); const rows=[];
      for(let si=1;si<S.samples.length;si++) S.gates.forEach(g=>{ const s=st.gs[si][g.id]; if(s.status==='auto'&&s.conf==='check') rows.push({si,g,why:s.notes[0]}); });
      if(!rows.length) say('Nothing is flagged right now. Every automatic gate was placed with a clear separation, or you have already handled it.');
      else { say(`${rows.length} gate${rows.length>1?'s':''} need${rows.length>1?'':'s'} a look. The rest were placed with clear separation.`);
        add(`<div class="tablewrap"><table class="mini-table"><thead><tr><th>Sample</th><th>Gate</th><th>Why</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(S.samples[r.si].label)}</td><td>${esc(r.g.name)}</td><td>${esc(r.why)}</td><td><button class="btn small" data-open="${r.si}:${r.g.id}">Open</button></td></tr>`).join('')}</tbody></table></div>`); }
    }
    else if(/prism|export|paste/.test(q)){
      const ro=matchReadout(q)||S.R[S.primary.readout]; call('export_prism',{readout:ro.id}); const tsv=Eng.prismTable(st,W.roles,Eng.readoutValues(st,ro));
      say(`Here is ${esc(ro.name)} (${esc(ro.unit)}) laid out for Prism, ${d.sp.length?'as a grouped table':'as a column table'}${d.paired?' with one row per '+esc(d.noun):''}.`);
      add(`<pre class="table">${esc(tsv)}</pre><div><button class="btn small" data-copytext="${esc(tsv)}">Copy table</button></div>`);
    }
    else if(/hold|robust|sensitiv|if i move|move the/.test(q)){
      const ro=S.R[S.primary.readout], sw=S.sweep, ch=S.ch[S.G[sw.gate].conds[sw.cond].ch]; call('check_robustness',{readout:ro.id,line:ch.label});
      const steps=Eng.sweep(st,W.roles); add(`<div class="chart">${robustSVG(steps,ro)}</div>`); say(holdsText(steps,ro,ch.label)+' The Results tab has the same strip with the line lock.');
    }
    else if(S.id==='cart'&&/tissue/.test(q)&&/(within|across|between|compare)/.test(q)){
      const roles={Mouse:'subject',Group:'split',Tissue:'compare',Day:'split'}; call('set_roles',roles); W.roles=roles; log('Agent set the study sheet to compare tissues within each mouse.');
      const ro=matchReadout(q)||S.R[S.primary.readout], an=Eng.analyze(st,W.roles,Eng.readoutValues(st,ro)), d2=Eng.describeDesign(S,W.roles); call('compare_groups',{readout:ro.id});
      say(`Tissue is now the comparison, and each mouse gave all three tissues, so the tests are paired within mouse. Groups and days are split. The Results tab has switched too.`);
      add(chartsHTML(an,ro,d2));
    }
    else { const ro=matchReadout(q);
      if(ro||/\bvs\b|versus|compare|differ|treated|control|mock/.test(q)){
        const r=ro||S.R[S.primary.readout], f=matchFilters(q); delete f[d.C.id]; call('compare_groups',Object.keys(f).length?{readout:r.id,filters:f}:{readout:r.id});
        const an=Eng.analyze(st,W.roles,Eng.readoutValues(st,r),f), c0=an.cells[0], t=c0&&c0.tests[0];
        if(t&&t.ok&&an.cells.length===1){ const a=c0.groups[0], b=c0.groups[1]; say(`${esc(r.name)}: ${fmtV(a.mean,r)} in ${esc(a.level)} and ${fmtV(b.mean,r)} in ${esc(b.level)} (${esc(r.unit)}). Difference ${fmtD(t.diff,r)}${unitWord(r)}, 95% CI ${fmtV(t.lo,r)} to ${fmtV(t.hi,r)}, ${t.name}, ${fmtP(t.p)}, n = ${t.n[0]} ${t.n[0]===1?d.noun:d.plural} per group.`); }
        else say(`${esc(r.name)} (${esc(r.unit)}), ${esc(d.C.levels.join(' vs '))}, using the ${d.test.toLowerCase()} the study sheet implies.`);
        add(chartsHTML(an,r,d));
      } else say('I can’t match that to a tool yet. Try one of the suggestions below.');
    }
  }catch(err){ say('That call failed: '+esc(err.message)); }
  W.chat.push(m);
}
function renderAgent(){
  const S=W.study, el=$('#tab-agent');
  if(!W.seeded){ W.seeded=true; agentAsk(S.chips[1]); }
  el.innerHTML=`<div class="panel-head"><p class="eyebrow">An endpoint for agents</p><h2>Agent</h2><p class="lede">The same gates, numbers and tests, exposed as tools an AI agent can call. Ask in plain English and see which tool runs.</p></div>
  <div class="ag-layout"><aside class="card"><h3>Tools this workspace exposes</h3><p class="meta">In the build these are MCP tools that Claude calls. Each runs against the same state you see in the other tabs.</p><ul class="tools">${TOOLS.map(([n,a,dsc])=>`<li><code>${n}${a}</code><span>${dsc}</span></li>`).join('')}</ul></aside>
  <div style="min-width:0"><p class="ag-note">In this prototype a keyword matcher stands in for Claude, so it works offline. The tool calls and their results are real.</p>
    <div class="chat" id="chat">${W.chat.map(m=>`<div class="msg-q">${esc(m.q)}</div><div class="msg-a">${m.parts.join('')}</div>`).join('')}</div>
    <form class="ag-form" id="ag-form"><label for="ag-in" class="sr">Ask the agent</label><input id="ag-in" autocomplete="off" placeholder="Ask about this study, e.g. ${esc(S.chips[2])}"><button class="btn primary" type="submit">Ask</button></form>
    <div class="prompts">${S.chips.map(c=>`<button class="btn small" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div></div></div>`;
  const run=t=>{ if(!t.trim()) return; agentAsk(t.trim()); renderAgent(); const ch=$('#chat'); const last=ch.lastElementChild; if(last) last.previousElementSibling.scrollIntoView({block:'start',behavior:'smooth'}); };
  $('#ag-form').onsubmit=e=>{ e.preventDefault(); run($('#ag-in').value); };
  $$('[data-chip]',el).forEach(b=>b.onclick=()=>run(b.dataset.chip));
  $$('[data-open]',el).forEach(b=>b.onclick=()=>{ const [si,gid]=b.dataset.open.split(':'); W.sel={si:+si,gid}; setTab('gates'); });
  $$('[data-copytext]',el).forEach(b=>b.onclick=()=>copyText(b.dataset.copytext,b.parentElement.previousElementSibling,'Copied. Paste it into a Prism data table.'));
}

/* ---------- study sheet ---------- */
function renderStudy(){
  const S=W.study, el=$('#tab-study'), d=Eng.describeDesign(S,W.roles), R=W.roles;
  const used=ch=>S.gates.filter(g=>(g.type==='thr'&&g.conds.some(c=>c.ch===ch))).map(g=>g.name);
  el.innerHTML=`<div class="panel-head"><p class="eyebrow">The sheet that builds the workspace</p><h2>${esc(S.name)}</h2><p class="lede">${esc(S.tagline)}. The sheet says what each sample is. The other tabs are built from it: which gates exist, what gets compared, how samples pair, and which test runs. Switch studies at the top to see the same app rebuild itself.</p></div>
  <div class="st-layout"><div class="stack">
    <div class="card"><h3>Samples<span class="count">${S.samples.length}</span></h3><div class="tablewrap"><table class="sheet"><thead><tr><th>Sample</th>${S.factors.map(f=>`<th>${esc(f.id)}<span class="role ${R[f.id]}">${ROLE_NAME[R[f.id]]}</span></th>`).join('')}<th>Events</th></tr></thead>
      <tbody>${S.samples.map((s,si)=>`<tr><td>${esc(s.label)}${si===0?' <em class="tag">template</em>':''}</td>${S.factors.map(f=>`<td>${esc(s.meta[f.id])}</td>`).join('')}<td class="mono">${fmtN(S.n)}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><h3>Panel<span class="count">${S.channels.filter(c=>c.kind==='fluor').length} colours</span></h3><div class="tablewrap"><table class="sheet"><thead><tr><th>Marker</th><th>Fluorochrome</th><th>Used in</th></tr></thead>
      <tbody>${S.channels.filter(c=>c.kind==='fluor').map(c=>`<tr><td>${esc(c.label)}</td><td class="mono">${esc(c.fluor)}</td><td>${esc(used(c.id).join(', ')||'–')}</td></tr>`).join('')}</tbody></table></div>
      <p class="meta" style="margin-top:8px">Gate tree: ${S.gates.map(g=>esc(g.name)).join(' → ').replace(/ → /g,' › ')}. Template from ${esc(S.samples[0].label)}. In the build, the FCS files and the FlowJo workspace (.wsp) fill this in; FlowKit reads both.</p></div>
  </div><div class="stack">
    <div class="card"><h3>What each column does</h3><div class="roles">${S.factors.map(f=>`<div class="r"><div><b>${esc(f.id)}</b><small>${f.levels.length} levels: ${esc(f.levels.slice(0,6).join(', '))}${f.levels.length>6?'…':''}</small></div>
      <select data-role="${f.id}" aria-label="Role of ${esc(f.id)}">${['compare','subject','split','ignore'].map(r=>`<option value="${r}" ${R[f.id]===r?'selected':''} ${r==='compare'&&f.levels.length>4?'disabled':''} ${r==='split'&&f.levels.length>4?'disabled':''}>${ROLE_NAME[r]}</option>`).join('')}</select></div>`).join('')}</div>
      <p class="hint" style="margin-top:10px">${S.id==='cart'?'Try setting Tissue to Compare. Each mouse gave all three tissues, so Mouse starts pairing them and the Results tab switches to paired tests.':'Try setting Donor to Ignore. The pairing disappears and the Results tab falls back to Welch’s t-test, which is the wrong test for this design.'}</p>
      <div class="toolbar"><button class="btn small" id="s-reset">Back to suggested roles</button></div></div>
    <div class="card"><h3>Built from this sheet</h3><ul class="built">${d.lines.map(l=>`<li><b>${esc(l.k)}</b><span>${esc(l.v)}</span></li>`).join('')}<li><b>Check</b><span>The ${esc(S.ch[S.G[S.sweep.gate].conds[S.sweep.cond].ch].label)} line gets a robustness strip in Results, because no clean dip separates the cells there.</span></li></ul></div>
  </div></div>`;
  $$('[data-role]',el).forEach(s=>s.onchange=()=>setRole(s.dataset.role,s.value));
  $('#s-reset').onclick=()=>{ W.roles=Object.assign({},S.defaultRoles); log('Set the study sheet back to its suggested roles.'); renderStudy(); toast('Back to the suggested roles.'); };
}
function setRole(fid,role){
  const S=W.study, R=W.roles, old=R[fid], notes=[];
  if(role==='compare') S.factors.forEach(f=>{ if(f.id!==fid&&R[f.id]==='compare'){ R[f.id]=f.levels.length<=4?'split':'ignore'; notes.push(`${f.id} moved to ${ROLE_NAME[R[f.id]]}`); } });
  if(role==='subject') S.factors.forEach(f=>{ if(f.id!==fid&&R[f.id]==='subject'){ R[f.id]='ignore'; notes.push(`${f.id} moved to Ignore`); } });
  if(old==='compare'&&role!=='compare'){ const alt=S.factors.find(f=>f.id!==fid&&R[f.id]!=='subject'&&f.levels.length>=2&&f.levels.length<=4); if(!alt){ toast('A study needs one column to compare.'); renderStudy(); return; } R[alt.id]='compare'; notes.push(`${alt.id} is now compared`); }
  R[fid]=role;
  const sp=S.factors.filter(f=>R[f.id]==='split'); if(sp.length>2){ const drop=sp.find(f=>f.id!==fid); R[drop.id]='ignore'; notes.push(`${drop.id} moved to Ignore (two splits at most)`); }
  log(`Set ${esc(fid)} to “${ROLE_NAME[role]}” on the study sheet.`);
  renderStudy(); const d=Eng.describeDesign(S,R); toast(`Rebuilt: ${d.test}${d.sp.length?', split by '+d.sp.map(f=>f.id).join(' and '):''}.${notes.length?' '+notes.join('; ')+'.':''}`);
}

/* ---------- boot ---------- */
$$('.tabs [role=tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$$('.switch [role=radio]').forEach(b=>b.onclick=()=>{ if(b.dataset.study!==W.id){ document.body.style.cursor='progress'; setTimeout(()=>{ switchStudy(b.dataset.study); document.body.style.cursor=''; },20); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#modal').hidden) $('#modal').hidden=true; });
const rerender=()=>{ CC=null; renderTab(); };
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rerender); }catch(e){}
new MutationObserver(rerender).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
let lastW=window.innerWidth, rT=null;
window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(Math.abs(window.innerWidth-lastW)>40){ lastW=window.innerWidth; renderTab(); } },200); });
switchStudy('treg',true);
})();
</script>
